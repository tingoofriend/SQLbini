# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: result_match
    status: active
    source: design/gdd/hidden-data-grader.md
    referenced_by:
      - design/gdd/hidden-data-grader.md
      - design/gdd/puzzle-definition-and-datasets.md
      - design/gdd/query-workbench.md
    variables:
      - cols
      - ordered
      - order_cols
      - canon
    output_range: [false, true]
    expression: "(cols(P) == cols(R)) and (ordered ? tie_list_eq(P, R) : multiset(canon rows P) == multiset(canon rows R))"
    notes: "Used by Run (visible match bit) and Submit. Column names ignored, column order significant. canon: NULL only equals NULL, 1 == 1.0, TEXT byte-exact, REAL rounded half-even to 6 decimals."
    added: 2026-10-14
    revised: "2026-10-14"  # cross-GDD review: referenced_by completed (query-workbench)
  - name: feedback_level
    status: active
    source: design/gdd/hidden-data-grader.md
    referenced_by:
      - design/gdd/hidden-data-grader.md
      - design/gdd/puzzle-definition-and-datasets.md
      - design/gdd/request-and-reaction-dialogue.md
    variables:
      - n_cause_fails
      - feedback_fails_per_level
      - feedback_max_level
    output_range: [1, 3]
    expression: "min(feedback_max_level, 1 + floor((max(n, 1) - 1) / max(k, 1)))"
    notes: "Request & Reaction Dialogue reads the level (feedback key). The Hint System reads the verdict only. MVP max level is 1."
    added: 2026-10-14
    revised: "2026-10-14"  # cross-GDD review: note trimmed (Hint reads verdict only); referenced_by completed
  - name: hardcode_proof
    status: active
    source: design/gdd/puzzle-definition-and-datasets.md
    referenced_by:
      - design/gdd/puzzle-definition-and-datasets.md
      - design/gdd/hidden-data-grader.md
    variables:
      - d
      - keys(ref(x))
      - K_d
    output_range: [false, true]
    expression: "keys(ref(d)) != (keys(ref(visible)) ∩ K_d)"
    notes: "true = a query listing the visible answer's keys (WHERE name IN (...)) fails on hidden dataset d. A puzzle with tagged traps needs >= 1 hidden dataset where it holds (puzzle_valid H). Grader rule cites it."
    added: 2026-10-14
    revised: ""
  - name: reaction_hold
    status: active
    source: design/gdd/request-and-reaction-dialogue.md
    referenced_by:
      - design/gdd/request-and-reaction-dialogue.md
      - design/gdd/shift-and-chapter-progression.md
    variables:
      - len
      - hold_base
      - read_cps
      - hold_min
      - hold_max
    output_range: [2.5, 6.0]
    expression: "clamp(hold_base + len / read_cps, hold_min, hold_max)"
    notes: "Seconds, at defaults (hold_base 1.0, read_cps 20, hold_min 2.5, hold_max 6.0). Controls only the automatic return of the bubble to the request; Progression's next request arrives when the PASS reaction ends."
    added: 2026-10-14
    revised: ""

