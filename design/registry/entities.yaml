# Game World Entity Registry
#
# PURPOSE: Single source of truth for all named game-world facts that appear
# in more than one document. Skills check this before writing new content to
# detect cross-doc inconsistencies at authoring time.
#
# RULES:
#   - Only register facts that cross system boundaries. Internal-only facts
#     (a formula used in one GDD only) do NOT need to be registered.
#   - Never delete entries — set status: deprecated instead.
#   - When a value changes: update the value, set revised: to today's date,
#     and add a comment with the old value and which GDD changed it.
#   - source: is the authoritative GDD — the one that "owns" this fact.
#     Other GDDs that reference it list themselves in referenced_by.
#   - When a new GDD references an existing entry, append its path to
#     referenced_by. Do not create a duplicate entry.
#
# WRITTEN BY: /design-system (Phase 5 — after GDD sections are approved)
#             /consistency-check (when resolving conflicts)
#             economy-designer, systems-designer (new cross-system entries,
#               after asking)
# READ BY:    /design-system (Phase 2 — before authoring begins, and after
#               Section C/D writes to conflict-check new entities/formulas)
#             /consistency-check (primary input — grep-first, GDD-second)
#             /review-all-gdds (Phase 1 — baseline for Phase 2 checks)
#             /design-review (Phase 1 — cross-doc facts, in place of sibling GDDs)
#             /content-audit (Step 2 — planned named-content count)
#             /balance-check (Phase 3 — intended constant/formula values)
#             /propagate-design-change (Step 3 — downstream GDD impact via referenced_by)
#             /asset-spec (named entities to write specs for)
#             economy-designer, systems-designer (before authoring items,
#               loot tables and formulas)
#
# SEARCH PATTERNS (for skills using Grep):
#   All entity names:        Grep pattern="^  - name:" path="design/registry/entities.yaml"
#   Specific entity:         Grep pattern="  - name: goblin" path="design/registry/entities.yaml"
#   All items:               Grep pattern="^  - name:" path="design/registry/entities.yaml" (items section)
#   What combat.md owns:     Grep pattern="source: design/gdd/combat.md"
#   What inventory.md uses:  Grep pattern="design/gdd/inventory.md" -B 8
#                            (referenced_by is a block list, so match the
#                            path; referenced_by.*inventory never matches)
#   All gold values:          Grep pattern="value_gold:"
#   Deprecated entries:      Grep pattern="status: deprecated"
#
# FORMAT: YAML. Consistent indentation is critical for grep reliability.
#   Sections: entities | items | formulas | constants
#   Each entry: name, status, source, referenced_by[], attributes{}, added, revised

version: 1
last_updated: "2026-10-14"

# ─── ENTITIES ────────────────────────────────────────────────────────────────
# Named game-world objects: enemies, NPCs, characters, factions, bosses.
# Register an entity here when it appears in more than one GDD — e.g., an
# enemy defined in combat.md that also drops items listed in inventory.md.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: any key stats that could appear in another GDD
#   (health, damage, drops, faction, etc.)

entities: []

# Example (remove when first real entry is added):
#
# entities:
#   - name: goblin
#     status: active              # active | deprecated
#     source: design/gdd/combat.md
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md
#     health: 40
#     damage: 8
#     drops:
#       - item: goblin_arm        # must match an entry in items section
#         qty: 1
#         drop_rate: 0.8          # 0.0–1.0
#     added: 2026-03-26
#     revised: ""


# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []

# Example:
#
# items:
#   - name: goblin_arm
#     status: active
#     source: design/gdd/combat.md   # drop defined in combat GDD
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md    # inventory GDD lists its weight/stack rules
#       - design/gdd/economy.md      # economy GDD references its sell price
#     value_gold: 5
#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: result_match
    status: active
    source: design/gdd/hidden-data-grader.md
    referenced_by:
      - design/gdd/hidden-data-grader.md
      - design/gdd/puzzle-definition-and-datasets.md
    variables:
      - cols
      - ordered
      - order_cols
      - canon
    output_range: [false, true]
    expression: "(cols(P) == cols(R)) and (ordered ? tie_list_eq(P, R) : multiset(canon rows P) == multiset(canon rows R))"
    notes: "Used by Run (visible match bit) and Submit. Column names ignored, column order significant. canon: NULL only equals NULL, 1 == 1.0, TEXT byte-exact, REAL rounded half-even to 6 decimals."
    added: 2026-10-14
    revised: ""
  - name: feedback_level
    status: active
    source: design/gdd/hidden-data-grader.md
    referenced_by:
      - design/gdd/hidden-data-grader.md
    variables:
      - n_cause_fails
      - feedback_fails_per_level
      - feedback_max_level
    output_range: [1, 3]
    expression: "min(feedback_max_level, 1 + floor((max(n, 1) - 1) / max(k, 1)))"
    notes: "Hint System and Request & Reaction Dialogue read the level. MVP max level is 1."
    added: 2026-10-14
    revised: ""

# Example:
#
# formulas:
#   - name: damage_formula
#     status: active
#     source: design/gdd/combat.md
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/progression.md   # progression GDD scales attack variable
#     variables:
#       - attack
#       - defense
#       - crit_chance
#       - crit_multiplier
#     output_range: [0, 999]
#     expression: "max(0, attack - defense) * (1 + crit_chance * crit_multiplier)"
#     notes: "Output feeds into health-system damage intake. Min is 0 (armour
#       can absorb all damage). Max is uncapped in formula but tuning knob
#       damage_cap in combat.md clamps at 999."
#     added: 2026-03-26
#     revised: ""


# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

constants:
  - name: grader_row_cap
    status: active
    source: design/gdd/hidden-data-grader.md
    referenced_by:
      - design/gdd/hidden-data-grader.md
      - design/gdd/puzzle-definition-and-datasets.md
      - design/gdd/sql-execution-sandbox.md
    value: 5000
    unit: rows
    notes: "Player results over the cap are SUBMIT_ERROR; references over the cap fail puzzle validation. SQL Execution Sandbox must report row counts against it. Safe range 1,000-50,000."
    added: 2026-10-14
    revised: ""
  - name: feedback_fails_per_level
    status: active
    source: design/gdd/hidden-data-grader.md
    referenced_by:
      - design/gdd/hidden-data-grader.md
    value: 2
    unit: failed submits
    notes: "k in feedback_level. Safe range 1-4."
    added: 2026-10-14
    revised: ""
  - name: visible_rows_max
    status: active
    source: design/gdd/puzzle-definition-and-datasets.md
    referenced_by:
      - design/gdd/puzzle-definition-and-datasets.md
    value: 30
    unit: rows per visible table
    notes: "Safe range 24-40. Below 24 withholds all of Chapter 1. Query Workbench UX spec must confirm on-screen readability at 1280x720."
    added: 2026-10-14
    revised: ""
  - name: exec_time_limit_ms
    status: active
    source: design/gdd/sql-execution-sandbox.md
    referenced_by:
      - design/gdd/sql-execution-sandbox.md
      - design/gdd/hidden-data-grader.md
    value: 100
    unit: ms per execution
    notes: "Clamped 50-150. UNENFORCED until the interrupt/threading ADR (sandbox Open Question 1). A TIMEOUT on hidden data stops grading (grader rule 8)."
    added: 2026-10-14
    revised: ""
  - name: exec_cost_target_ms
    status: active
    source: design/gdd/sql-execution-sandbox.md
    referenced_by:
      - design/gdd/sql-execution-sandbox.md
    value: 25
    unit: ms p95 per execution on target PC
    notes: "Hard ceiling 30. Measured dev-laptop p95 0.37 ms (spike addendum). Keeps 2+D executions within the grader's 300 ms submit budget."
    added: 2026-10-14
    revised: ""
  - name: display_rows_max
    status: active
    source: design/gdd/query-workbench.md
    referenced_by:
      - design/gdd/query-workbench.md
    value: 200
    unit: rendered result rows
    notes: "Range 50-500. True row count always shown; marks computed over all rows."
    added: 2026-10-14
    revised: ""
  - name: contrast_min
    status: active
    source: design/gdd/query-workbench.md
    referenced_by:
      - design/gdd/query-workbench.md
    value: 4.5
    unit: contrast ratio (WCAG AA text)
    notes: "Every theme and state, incl. stale results. Glyphs, borders, focus rings >= 3:1. Art bible and accessibility requirements must adopt it."
    added: 2026-10-14
    revised: ""
  - name: editor_font_px
    status: active
    source: design/gdd/query-workbench.md
    referenced_by:
      - design/gdd/query-workbench.md
    value: 18
    unit: px at 1280x720
    notes: "Range 14-32; table_font_px default 16; ui_scale 1.0-2.0 multiplies both."
    added: 2026-10-14
    revised: ""
  - name: feedback_max_level
    status: active
    source: design/gdd/hidden-data-grader.md
    referenced_by:
      - design/gdd/hidden-data-grader.md
    value: 1
    unit: level
    notes: "MVP = 1; Vertical Slice = 3 (levels 2-3 deferred by scope-check 2026-10-14)."
    added: 2026-10-14
    revised: ""

