# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

constants:
  - name: grader_row_cap
    status: active
    source: design/gdd/hidden-data-grader.md
    referenced_by:
      - design/gdd/hidden-data-grader.md
      - design/gdd/puzzle-definition-and-datasets.md
      - design/gdd/sql-execution-sandbox.md
      - design/gdd/query-workbench.md
      - design/gdd/request-and-reaction-dialogue.md
    value: 5000
    unit: rows
    notes: "Player results over the cap on any visible run are SUBMIT_ERROR (kind TOO_MANY_ROWS, no error_text); over the cap on a hidden dataset only, the dataset mismatches (FAIL, cause generic, counted); references over the cap fail puzzle validation. Sandbox and Workbench express the cap as grader_row_cap (R_cap): fetch limit = grader_row_cap + 1, strings formatted from the value ('{grader_row_cap}+ rows'), never a hardcoded 5000. Safe range 1,000-50,000."
    added: 2026-10-14
    revised: "2026-10-15"  # cross-review 6d: note split visible (TOO_MANY_ROWS) vs hidden-only (FAIL generic); earlier 2026-10-14 (C16): note + referenced_by; value unchanged
  - name: feedback_fails_per_level
    status: active
    source: design/gdd/hidden-data-grader.md
    referenced_by:
      - design/gdd/hidden-data-grader.md
      - design/gdd/hint-system.md
    value: 2
    unit: failed submits
    notes: "k in feedback_level. Safe range 1-4."
    added: 2026-10-14
    revised: "2026-10-14"  # cross-GDD review: referenced_by completed
  - name: visible_rows_max
    status: active
    source: design/gdd/puzzle-definition-and-datasets.md
    referenced_by:
      - design/gdd/puzzle-definition-and-datasets.md
      - design/gdd/query-workbench.md
    value: 30
    unit: rows per visible table
    notes: "Safe range 24-40. Below 24 withholds all of Chapter 1. Readability resolved 2026-10-16 (design/ux/query-workbench.md, user): no dedicated visible-data view; the data is read by Run and a full table scrolls in the result grid; value 30 kept."
    added: 2026-10-14
    revised: "2026-10-14"  # cross-GDD review (C26): status -> pending /ux-design
  - name: exec_time_limit_ms
