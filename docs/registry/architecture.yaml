    interface: "BuildFlavour.current() -> &\"dev\" | &\"playtest\" | &\"release\" (resolved once at boot from feature tags)"
    write_access: foundation-build-flavour-only
    referenced_by:
      - docs/architecture/adr-0004-event-bus-and-playtest-log.md
      - docs/architecture/adr-0003-puzzle-data-format-loader-and-verifier.md
