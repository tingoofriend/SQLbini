# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets:
  - system: sql-execution-sandbox
    status: active
    budget_ms: 0
    adr: docs/architecture/adr-0001-sandbox-execution-and-timeout.md
    notes: "Main-thread cost ~0 (lexer check only); TIMEOUT delivered within exec_time_limit + 50 ms; frame stays <= 16.6 ms during any execution (SB-18, SB-19)"
    referenced_by:
      - docs/architecture/adr-0001-sandbox-execution-and-timeout.md
    added: 2026-10-15
    revised: ""

