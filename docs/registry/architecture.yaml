# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: main_thread_query_wait
    status: active
    description: "No code may block the main thread waiting for a SQL execution (no wait_to_finish on a live thread, no OS.delay_* polling loops)."
    why: "Player SQL can run for minutes; sandbox rule 15 and SB-19 require the frame never to block."
    adr: docs/architecture/adr-0001-sandbox-execution-and-timeout.md
    added: 2026-10-15

  - pattern: cross_thread_sqlite_object
    status: active
    description: "A godot-sqlite SQLite object must be created, used and closed on one thread; never passed between threads."
    why: "Each execution owns its database; an abandoned worker may still be inside SQLite when the next request starts."
    adr: docs/architecture/adr-0001-sandbox-execution-and-timeout.md
    added: 2026-10-15

  - pattern: sql_text_search_outside_lexer
    status: active
    description: "No module may split, regex or substring-search player SQL for keywords or statements; use SqlSandbox.tokenize."
    why: "Keywords inside strings, quoted identifiers or comments would match, and systems would disagree on what a keyword is."
    adr: docs/architecture/adr-0002-sandbox-api-and-lexer-contract.md
    added: 2026-10-15

  - pattern: row_values_by_dictionary_order
    status: active
    description: "godot-sqlite query_result rows must be converted to positional arrays by the PRAGMA column list, never by Dictionary iteration order."
    why: "Column order is significant for grading (grader rule 16)."
    adr: docs/architecture/adr-0002-sandbox-api-and-lexer-contract.md
    added: 2026-10-15

  - pattern: raw_json_numbers
    status: active
    description: "Values from JSON.parse_string / JSON.parse must be converted through their declared type before reaching SQLite, the grader or the hash."
    why: "Godot 4.7.2 parses every JSON number as float (198 -> 198.0)."
    adr: docs/architecture/adr-0003-puzzle-data-format-loader-and-verifier.md
    added: 2026-10-15

  - pattern: content_check_outside_verifier
    status: active
    description: "No script (Python or GDScript) other than ContentVerifier may decide puzzle or content validity."
    why: "CI and the game must reach the same verdict (puzzle L-04)."
    adr: docs/architecture/adr-0003-puzzle-data-format-loader-and-verifier.md
    added: 2026-10-15

  - pattern: hashing_objects_with_json_stringify
    status: active
    description: "Never pass a RefCounted/Object to JSON.stringify for hashing; use to_canonical() Dictionaries with String keys."
    why: "Objects print as instance ids, so the hash changes every run."
    adr: docs/architecture/adr-0003-puzzle-data-format-loader-and-verifier.md
    added: 2026-10-15

  - pattern: gameplay_on_event_recorded
    status: active
    description: "Gameplay logic must never subscribe to EventBus.event_recorded; systems control each other through their own typed signals."
    why: "The recorder is absent in release builds and stops on write failure; gameplay must not change with it (events record, signals control)."
    adr: docs/architecture/adr-0004-event-bus-and-playtest-log.md
    added: 2026-10-15

  - pattern: feature_tag_checks_outside_build_flavour
    status: active
    description: "No code may call OS.has_feature for dev/playtest/release decisions except BuildFlavour."
    why: "Content withholding and logging must agree on the build flavour."
    adr: docs/architecture/adr-0004-event-bus-and-playtest-log.md
    added: 2026-10-15

  - pattern: direct_log_file_writes
    status: active
    description: "No system writes playtest log lines directly; all events go through EventBus.emit_event."
    why: "Catalogue validation, stamping and undeclared counting happen only in the bus."
    adr: docs/architecture/adr-0004-event-bus-and-playtest-log.md
    added: 2026-10-15

  - pattern: gameplay_autoloads
    status: active
    description: "Game systems must not be autoloads or be looked up by /root/ node paths; they are injected (setup / _init). Addon tooling autoloads (e.g. gdUnit4) are allowed."
    why: "Coding standard: DI over singletons; tests swap fakes without global state."
    adr: docs/architecture/adr-0006-composition-root-and-service-wiring.md
    added: 2026-10-15

  - pattern: time_outside_clock
    status: active
    description: "Rule code must not call Time.* or use frame delta for rules; read the injected Clock. Only RealClock calls Time.*."
    why: "Timed rules (hints, dialogue holds, sandbox timeout, log t_ms) must run under a fake clock."
    adr: docs/architecture/adr-0006-composition-root-and-service-wiring.md
    added: 2026-10-15

  - pattern: mutual_refcounted_references
    status: active
    description: "Services must not hold strong references to each other in both directions or hold the Services container; back-references use signals or WeakRef."
    why: "RefCounted cycles are never freed (probed: ObjectDB leak at exit)."
    adr: docs/architecture/adr-0006-composition-root-and-service-wiring.md
    added: 2026-10-15

  - pattern: signal_connection_order_dependence
    status: active
    description: "No consumer may depend on the order in which one signal calls its connections, or on the order of call_deferred calls from different objects; same-frame line order goes through the Dialogue reaction queue."
    why: "Connection call order is not sourceable for 4.7, and the RD-19 inversion comes from call nesting, not connection order."
    adr: docs/architecture/adr-0010-gameplay-signal-contracts.md
    added: 2026-10-16

  - pattern: self_wired_gameplay_signals
    status: active
    description: "Gameplay systems must not connect themselves to another system's signals; all gameplay connections are made in GameplayWiring.connect_all."
    why: "Keeps the cross-system graph in one place and avoids consumers holding producer references."
    adr: docs/architecture/adr-0010-gameplay-signal-contracts.md
    added: 2026-10-16

  - pattern: hardcoded_tuning_or_player_text
    status: active
    description: "No gameplay tuning value or player-facing string literal in src/; values via GameConfig, text via StringTable."
    why: "Coding standard (data-driven) and dialogue RD-12; one validated source per knob and string id."
    adr: docs/architecture/adr-0007-tuning-config-string-tables-and-settings.md
    added: 2026-10-16

  - pattern: translation_server_at_mvp
    status: active
    description: "Do not use tr() / TranslationServer at MVP; the UI root sets auto_translate_mode = DISABLED."
    why: "Probed: a registered Translation silently re-translates already-resolved text whose content matches a key."
    adr: docs/architecture/adr-0007-tuning-config-string-tables-and-settings.md
    added: 2026-10-16

