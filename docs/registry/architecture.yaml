#       - docs/architecture/adr-0007-ui-system.md       # reads to display HUD
#     added: 2026-03-26
#     revised: ""


# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: sandbox_execution_delivery
    status: active
    pattern: direct_call
    producer: sql-execution-sandbox
    consumers:
      - hidden-data-grader
      - query-workbench
      - content-verifier
    adr: docs/architecture/adr-0001-sandbox-execution-and-timeout.md
    signal_signature: "ExecutionRunner.run(work: Callable, limit_ms: float, on_done: Callable) — on_done(value: Dictionary, timed_out: bool) called exactly once on the main thread"
    referenced_by:
      - docs/architecture/adr-0001-sandbox-execution-and-timeout.md
    added: 2026-10-15
    revised: ""

  - contract: sandbox_public_api
    status: active
    pattern: direct_call
    producer: sql-execution-sandbox
    consumers:
      - hidden-data-grader
      - query-workbench
      - content-verifier
      - hint-system
      - constraint-challenges
    adr: docs/architecture/adr-0002-sandbox-api-and-lexer-contract.md
    signal_signature: "await SqlSandbox.execute(request: SqlRequest) -> SqlResult; SqlSandbox.tokenize(sql: String) -> Array[SqlToken] (sync, total; kinds WORD NUMBER STRING QUOTED_IDENT COMMENT PUNCT)"
    referenced_by:
      - docs/architecture/adr-0002-sandbox-api-and-lexer-contract.md
    added: 2026-10-15
    revised: ""

  - contract: content_validity
    status: active
    pattern: direct_call
    producer: puzzle-definition-and-datasets
    consumers:
      - hidden-data-grader
      - shift-and-chapter-progression
      - playtest-log
      - ci
    adr: docs/architecture/adr-0003-puzzle-data-format-loader-and-verifier.md
    signal_signature: "await PuzzleRepository.verify_all() -> ContentReport; same ContentVerifier for CI (tools/ci/verify_content.gd) and game load"
    referenced_by:
      - docs/architecture/adr-0003-puzzle-data-format-loader-and-verifier.md
    added: 2026-10-15
    revised: ""

