# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: sql_execution_concurrency
    status: active
    api: "Thread (one dedicated Thread per execution, joined with wait_to_finish once !is_alive)"
    not: WorkerThreadPool
    adr: docs/architecture/adr-0001-sandbox-execution-and-timeout.md
    reason: "An abandoned query can occupy a thread for seconds to minutes; in the pool it would starve engine tasks"
    referenced_by:
      - docs/architecture/adr-0001-sandbox-execution-and-timeout.md
    added: 2026-10-15
    revised: ""

  - purpose: sql_statement_splitting_and_keyword_matching
    status: active
    api: "SqlLexer (hand-written GDScript lexer owned by the sandbox)"
    not: "sqlite3_complete / prepare-tail (not exposed by godot-sqlite v4.9); regex or substring search on SQL text"
    adr: docs/architecture/adr-0002-sandbox-api-and-lexer-contract.md
    reason: "One lexer for the statement check, Constraint Challenges keyword rules and Hint normalization, so they never disagree"
    referenced_by:
      - docs/architecture/adr-0002-sandbox-api-and-lexer-contract.md
    added: 2026-10-15
    revised: ""

  - purpose: content_file_format
    status: active
    api: "JSON (JSON.new().parse) + schema-typed conversion; SHA-256 over to_canonical() via JSON.stringify(sort_keys, full_precision)"
    not: ".tres resources, YAML, SQL-script datasets, Python verifier"
    adr: docs/architecture/adr-0003-puzzle-data-format-loader-and-verifier.md
    reason: "Diffable one-file-per-puzzle text; one parser and one verifier shared by CI and the game"
    referenced_by:
      - docs/architecture/adr-0003-puzzle-data-format-loader-and-verifier.md
    added: 2026-10-15
    revised: ""

